function buildSeries(baseLevel, totalReturnPct, volAmp, phaseShift, count) {
  const start = baseLevel / (1 + totalReturnPct / 100);
  const pts = [];
  for (let i = 0; i < count; i++) {
    const progress = count > 1 ? i / (count - 1) : 0;
    const wave = Math.sin(progress * Math.PI * 3.5 + phaseShift) * volAmp * (1 - progress * 0.25);
    const normPct = (totalReturnPct * progress) + wave;
    const level = start * (1 + normPct / 100);
    pts.push({ label: `T${i + 1}`, level, normPct });
  }
  return pts;
}

// ==================== 3. CORRELATION & QUANT ENGINES ====================
function seriesReturns(arr) {
  const out = [];
  for (let i = 1; i < arr.length; i++) {
    const prev = Math.max(0.0001, arr[i - 1]);
    out.push(((arr[i] - prev) / prev) * 100);
  }
  return out;
}

function pearsonCorrelation(a, b) {
  const n = Math.min(a.length, b.length);
  if (n < 2) return 0;
  const x = a.slice(-n);
  const y = b.slice(-n);
  const mx = x.reduce((s, v) => s + v, 0) / n;
  const my = y.reduce((s, v) => s + v, 0) / n;
  let num = 0, sx = 0, sy = 0;
  for (let i = 0; i < n; i++) {
    const dx = x[i] - mx, dy = y[i] - my;
    num += dx * dy;
    sx += dx * dx;
    sy += dy * dy;
  }
  const denom = Math.sqrt(sx * sy);
  return denom < 1e-9 ? 0 : Math.max(-1, Math.min(1, num / denom));
}

function computeStockTelemetry(stock) {
  const n225 = INDICES.find(i => i.code === "N225");
  const dax = INDICES.find(i => i.code === "DAX");
  const bse = INDICES.find(i => i.code === "SENSEX");
  const spx = INDICES.find(i => i.code === "SPX");

  const stRet = seriesReturns(stock.spark);
  const n225Ret = seriesReturns(n225.series["1M"].map(p => p.level)).slice(-stRet.length);
  const daxRet = seriesReturns(dax.series["1M"].map(p => p.level)).slice(-stRet.length);
  const bseRet = seriesReturns(bse.series["1M"].map(p => p.level)).slice(-stRet.length);

  const nikkeiCorr = pearsonCorrelation(stRet, n225Ret);
  const daxCorr = pearsonCorrelation(stRet, daxRet);
  const bseCorr = pearsonCorrelation(stRet, bseRet);

  const primary = stock.region === "APAC" ? n225 : stock.region === "EUROPE" ? dax : stock.region === "INDIA" ? bse : spx;
  const longBench = seriesReturns(primary.series["5Y"].map(p => p.level));
  const seed = stock.symbol.split("").reduce((s, c) => s + c.charCodeAt(0), 0);
  const prefixLen = Math.max(0, longBench.length - stRet.length);
  const synthLong = [];
  for (let i = 0; i < prefixLen; i++) {
    synthLong.push(longBench[i] * stock.beta + Math.sin(i * 0.7 + seed) * 0.25);
  }
  const fullStock = synthLong.concat(stRet);
  const longC = pearsonCorrelation(fullStock.slice(-59), longBench.slice(-59));
  const shortC = pearsonCorrelation(fullStock.slice(-12), longBench.slice(-12));
  const drift = longC - shortC;

  let level = "ALIGNED";
  if (drift > 0.45 || (shortC < 0 && longC > 0.4)) level = "DIVERGING";
  else if (drift > 0.25) level = "WATCH";

  const plainReason = level === "ALIGNED"
    ? `${stock.symbol} is moving with ${primary.name} as usual.`
    : level === "WATCH"
      ? `${stock.symbol} has started to move differently from ${primary.name}. Keep an eye on it.`
      : `${stock.symbol} is now moving very differently from ${primary.name}. Find out why before you invest.`;

  const quantReason = `ρ(12d)=${shortC.toFixed(2)} vs ρ(59d)=${longC.toFixed(2)}, Δρ=${drift.toFixed(2)} vs ${primary.name}`;

  const spreads = [
    ["NIKKEI 225", stock.dailyPct - n225.dailyPct],
    ["DAX 40", stock.dailyPct - dax.dailyPct],
    ["BSE SENSEX", stock.dailyPct - bse.dailyPct]
  ];
  spreads.sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const [domName, domSpread] = spreads[0];
  const isRealTimeDiverging = level !== "ALIGNED" || Math.abs(domSpread) >= 1.35 || Math.abs(nikkeiCorr) < 0.35 || daxCorr < 0 || Math.abs(bseCorr) < 0.30;

  return {
    symbol: stock.symbol,
    benchmarkName: primary.name,
    shortCorr: shortC,
    longCorr: longC,
    drift,
    level,
    plainReason,
    quantReason,
    nikkeiCorr,
    daxCorr,
    bseCorr,
    liveSpreadDeltaPct: domSpread,
    dominantBenchmark: domName,
    isRealTimeDiverging
  };
}

function evaluateDiagnostics(exprRaw) {
  const expr = (exprRaw || "PORTFOLIO_AUDIT()").trim();
  const totalVal = state.holdings.reduce((s, h) => {
    const st = STOCKS.find(x => x.symbol === h.symbol);
    return s + h.shares * (st ? st.price : h.avgCost);
  }, 0);
  let weightedBeta = 1.04;
  let topEx = "Unallocated";
  let topPct = 0;
  if (totalVal > 0) {
    weightedBeta = state.holdings.reduce((s, h) => {
      const st = STOCKS.find(x => x.symbol === h.symbol);
      const val = h.shares * (st ? st.price : h.avgCost);
      return s + (val / totalVal) * (st ? st.beta : 1.0);
    }, 0);
    const byEx = {};
    state.holdings.forEach(h => {
      const st = STOCKS.find(x => x.symbol === h.symbol);
      byEx[h.exchange] = (byEx[h.exchange] || 0) + h.shares * (st ? st.price : h.avgCost);
    });
    for (const [k, v] of Object.entries(byEx)) {
      const pct = (v / totalVal) * 100;
      if (pct > topPct) { topPct = pct; topEx = k; }
    }
  }
  const betaCap = state.riskProfile === "conservative" ? 1.05 : state.riskProfile === "moderate" ? 1.25 : 1.55;
  const alertedSymbols = new Set(state.alerts.map(a => a.symbol));
  const unguarded = state.holdings.filter(h => {
    const st = STOCKS.find(x => x.symbol === h.symbol);
    return st && st.beta > 1.2 && !alertedSymbols.has(h.symbol);
  });

  const ndx = INDICES.find(i => i.code === "NDX");
  const dax = INDICES.find(i => i.code === "DAX");
  const sensex = INDICES.find(i => i.code === "SENSEX");
  const volSpread = ndx.vol - sensex.vol;
  const peSpread = ndx.pe - dax.pe;

  const metrics = [
    { metric: "Weighted Portfolio Beta", result: `${weightedBeta.toFixed(2)} (Cap ${betaCap.toFixed(2)})`, status: weightedBeta > betaCap ? "ANOMALY" : "PASS" },
    { metric: "Exchange Concentration", result: `${topEx} ${topPct.toFixed(1)}%`, status: topPct > 55 ? "ANOMALY" : topPct > 38 ? "DRIFT" : "PASS" },
    { metric: "NDX–SENSEX Vol Spread", result: `+${volSpread.toFixed(1)}%`, status: volSpread > 5.0 ? "DRIFT" : "PASS" },
    { metric: "US–DAX Valuation Gap", result: `+${peSpread.toFixed(1)}x P/E`, status: "DRIFT" },
    { metric: "Unguarded High-Beta", result: `${unguarded.length} asset(s)`, status: unguarded.length > 0 ? "ANOMALY" : "PASS" }
  ];

  const anomalies = metrics.filter(m => m.status === "ANOMALY").length;
  return { expr, totalVal, weightedBeta, topEx, topPct, unguarded, metrics, anomalies };
}

function sparkSvg(points, color) {
  if (!points || points.length < 2) return "";
  const min = Math.min(...points), max = Math.max(...points);
  const span = Math.max(0.0001, max - min);
  const w = 78, h = 28;
  const coords = points.map((v, i) => {
    const x = (i / (points.length - 1)) * w;
    const y = h - 3 - ((v - min) / span) * (h - 6);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${coords}"/></svg>`;
}

function drawDivergenceChart() {
  const canvas = document.getElementById("divergenceCanvas");
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(300, rect.width * dpr);
  canvas.height = 260 * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const w = rect.width, h = 260;
  ctx.clearRect(0, 0, w, h);

  const active = INDICES.filter(i => state.compareCodes.includes(i.code));
  if (!active.length) return;
  const allVals = active.flatMap(i => i.series[state.compareRange].map(p => p.normPct));
  const min = Math.min(...allVals, 0), max = Math.max(...allVals, 1);
  const span = Math.max(1, max - min);
  const padL = 42, padR = 14, padT = 16, padB = 26;
  const cw = w - padL - padR, ch = h - padT - padB;

  ctx.strokeStyle = "rgba(148,163,184,0.18)";
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = padT + (ch * g) / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    const val = max - (span * g) / 4;
    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px JetBrains Mono, monospace";
    ctx.fillText(val.toFixed(0) + "%", 4, y + 4);
  }

  active.forEach(idx => {
    const pts = idx.series[state.compareRange];
    ctx.strokeStyle = idx.color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = padL + (i / (pts.length - 1)) * cw;
      const y = padT + ch - ((p.normPct - min) / span) * ch;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });

  if (hoveredPointIdx !== null) {
    const ptsCount = active[0].series[state.compareRange].length;
    const clamped = Math.max(0, Math.min(ptsCount - 1, hoveredPointIdx));
    const hx = padL + (clamped / (ptsCount - 1)) * cw;
    ctx.strokeStyle = "rgba(248,250,252,0.45)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, h - padB); ctx.stroke();
    ctx.setLineDash([]);
    const info = active.map(idx => `${idx.code}: ${idx.series[state.compareRange][clamped].normPct.toFixed(1)}%`).join("  •  ");
    const infoEl = document.getElementById("chartHoverInfo");
    if (infoEl) infoEl.textContent = info;
  }

  canvas.onmousemove = (e) => {
    const r = canvas.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (e.clientX - r.left - padL) / cw));
    hoveredPointIdx = Math.round(rel * (active[0].series[state.compareRange].length - 1));
    drawDivergenceChart();
  };
}

function saveNewsPick(idx) {

  state.savedReports.unshift({ id: "rep_" + Date.now(), tier: state.tier, ...n });
  renderCurrent();
  showToast(`Saved ${n.ticker} brief to archive.`);
}

function deleteSavedReport(id) {
  state.savedReports = state.savedReports.filter(r => r.id !== id);
  renderCurrent();
}

function toggleWatchlist(symbol) {
  const exists = state.watchlist.some(w => w.symbol === symbol);
  if (exists) {
    state.watchlist = state.watchlist.filter(w => w.symbol !== symbol);
    showToast(`Removed ${symbol} from Smart Watchlist.`);
  } else {
    const st = STOCKS.find(s => s.symbol === symbol);
    const tel = st ? computeStockTelemetry(st) : null;
    state.watchlist.push({
      symbol,
      tag: tel?.isRealTimeDiverging ? "DIVERGENCE_ALERT" : "NONE",
      alertActive: !!tel?.isRealTimeDiverging,
      confidence: tel?.isRealTimeDiverging ? 78 : 0,
      summary: tel ? `${tel.plainReason} Live spread ${tel.liveSpreadDeltaPct.toFixed(2)}% vs ${tel.dominantBenchmark}.` : "Added to Smart Watchlist."
    });
    showToast(`Added ${symbol} to Smart Watchlist.`);
  }
  renderCurrent();
}

function loadStarterWatchlist() {
  state.watchlist = ["NVDA", "7203.T", "SAP.DE", "RELIANCE.BO"].map(sym => ({
    symbol: sym, tag: "NONE", alertActive: false, confidence: 0, summary: "Ready for NIKKEI, DAX & BSE correlation scan."
  }));
  renderCurrent();
}

function scanWatchlistDivergence() {
  let triggered = 0;
  state.watchlist = state.watchlist.map(w => {
    const st = STOCKS.find(s => s.symbol === w.symbol);
    if (!st) return w;
    const tel = computeStockTelemetry(st);
    const isDiv = tel.level !== "ALIGNED" || Math.abs(tel.liveSpreadDeltaPct) >= 1.2;
    if (isDiv) triggered++;
    return {
      ...w,
      tag: tel.level === "DIVERGING" ? "CORRELATION_BREAK" : isDiv ? "DIVERGENCE_ALERT" : "ALIGNED",
      alertActive: isDiv,
      confidence: isDiv ? Math.min(96, Math.round(74 + Math.abs(tel.drift) * 35)) : 82,
      summary: state.tier === "adult"
        ? `${tel.quantReason} | N225=${tel.nikkeiCorr.toFixed(2)}, DAX=${tel.daxCorr.toFixed(2)}, BSE=${tel.bseCorr.toFixed(2)}`
        : `${tel.plainReason} Anchor spread vs ${tel.dominantBenchmark}: ${tel.liveSpreadDeltaPct >= 0 ? "+" : ""}${tel.liveSpreadDeltaPct.toFixed(2)}%.`
    };
  });
  renderCurrent();
  showToast(`Tagged ${triggered} divergence alert(s) across NIKKEI, DAX & BSE.`);
}

function quickAddHolding(symbol) {
  const st = STOCKS.find(s => s.symbol === symbol);
  if (!st) return;

function deleteHolding(id) {

function createHedgeAlert(symbol) {
  const st = STOCKS.find(s => s.symbol === symbol);
  if (!st) return;
  state.alerts.unshift({ id: "a_" + Date.now(), symbol: st.symbol, exchange: st.exchange, targetPct: 2.5, direction: "both", triggered: false, read: false, msg: `Monitoring +/- 2.5% volatility move on ${st.symbol}` });
  renderCurrent();
  showToast(`Created +/- 2.5% hedge alert for ${st.symbol}.`);
}

function deleteAlert(id) {
  state.alerts = state.alerts.filter(a => a.id !== id);
  renderCurrent();
}

function simulateAlertMove() {
  const target = STOCKS[0];
  target.dailyPct = 3.85;
  target.price *= 1.0385;
  const msg = `${target.symbol} (${target.exchange}) surged +3.85% on semiconductor demand.`;
  state.alerts.unshift({ id: "a_" + Date.now(), symbol: target.symbol, exchange: target.exchange, targetPct: 2.5, direction: "up", triggered: true, read: false, msg });
  if (window.FinAdvisorAndroidBridge && window.FinAdvisorAndroidBridge.postAlertNotification) {
    window.FinAdvisorAndroidBridge.postAlertNotification(`FinAdvisor Alert: ${target.symbol}`, msg);
  }
  renderCurrent();
  showToast(msg);
}

function runDiagnosticExpr(expr) {
  state.scenarioExpr = expr.trim() || "PORTFOLIO_AUDIT()";
  renderCurrent();
  showToast("Executed Quant Strategy Audit trace.");
}
